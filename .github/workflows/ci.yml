name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Core has no platform imports
        run: npm run lint:core

      - name: Test (unit, crash, simulator, vectors, CLI, MCP)
        run: npm test

      - name: Build
        run: npm run build

      - name: Conformance runner passes against the reference responder
        run: node dist/conformance/cli.js -- node dist/conformance/reference.js
        env:
          ZIMRA_VECTOR_KEY: vectors/test-key.pem

  android-bindings:
    # The Kotlin module needs an Android SDK; here we check the TypeScript
    # side compiles against real React Native types.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - working-directory: packages/react-native
        run: npm install --no-package-lock --legacy-peer-deps
      - working-directory: packages/react-native
        run: npm run typecheck
